default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: retro_arcade_development

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("ARCADE_DB_NAME", "retro_arcade_production") %>
    username: <%= ENV.fetch("ARCADE_DB_USER", "arcade") %>
    password: <%= ENV["ARCADE_DB_PASSWORD"] %>
    host: <%= ENV.fetch("ARCADE_DB_HOST", "localhost") %>
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate

